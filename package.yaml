name:                prokki
version:             0.2.15
github:              "senysenyseny16/prokki"
license:             BSD-3-Clause
author:              "Arseny Yanchenko"
maintainer:          "arseny@protonmail.com"
copyright:           "2025 Arseny Yanchenko"

extra-source-files:
- README.md
- CHANGELOG.md
- LICENSE

description: Please see the README on GitHub at <https://github.com/senysenyseny16/prokki#readme>

dependencies:
- base >= 4.7 && < 5
- wai
- wai-extra
- warp
- http-conduit
- http-types
- blaze-html
- html-conduit
- xml-conduit
- network-uri
- conduit
- postgresql-simple
- resource-pool
- amazonka
- amazonka-core
- amazonka-s3
- microlens
- resourcet
- unliftio-core
- stm
- mtl
- transformers
- exceptions
- bytestring
- containers
- psqueues
- text
- time
- human-readable-duration
- co-log
- co-log-concurrent
- tomland
- file-embed
- optparse-applicative
- crypton

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

default-extensions:
  - OverloadedStrings
  - BlockArguments
  - RecordWildCards
  - PatternSynonyms
  - TypeApplications
  - FlexibleContexts
  - DuplicateRecordFields

library:
  source-dirs: src

executables:
  prokki:
    main: Main.hs
    source-dirs: app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - prokki

tests:
  prokki-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - hspec
    - prokki
